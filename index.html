<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="IELTS 8.0 AI">
    <meta name="theme-color" content="#060913">
    <title>IELTS 8.0 AI — Protected Vault</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #060913;
            background-image:
                radial-gradient(circle at 15% 15%, rgba(59, 130, 246, 0.16), transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(16, 185, 129, 0.12), transparent 40%);
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .vault-card {
            width: 100%;
            max-width: 390px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 26px;
            padding: 28px 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #6ee7b7;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.04em;
            margin-bottom: 12px;
        }
        h1 {
            margin: 0 0 6px 0;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        p {
            margin: 0 0 20px 0;
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.5;
        }
        input[type="password"] {
            width: 100%;
            padding: 13px 15px;
            border-radius: 14px;
            background: #0c1222;
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="password"]:focus {
            border-color: #10b981;
        }
        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 12px 0 18px 0;
            font-size: 12px;
            color: #cbd5e1;
            cursor: pointer;
            user-select: none;
        }
        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #2563eb, #10b981);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.2s;
        }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.6; cursor: wait; }
        .err {
            margin-top: 12px;
            font-size: 12px;
            color: #fda4af;
            min-height: 18px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="vault-card">
        <div class="badge">AES-256-GCM PROTECTED</div>
        <h1>Khu Vực Riêng Tư</h1>
        <p>Mã nguồn và cấu hình AI đã được niêm phong. Nhập mật khẩu của bạn để giải mã và khởi chạy.</p>
        <form id="unlockForm">
            <input id="pwdInput" type="password" placeholder="Nhập mật khẩu mở khóa..." autocomplete="current-password" required>
            <label class="remember">
                <input id="rememberChk" type="checkbox" checked>
                <span>Ghi nhớ trên thiết bị này (không cần nhập lại)</span>
            </label>
            <button id="unlockBtn" type="submit">Giải Mã &amp; Mở Ứng Dụng</button>
            <div id="errBox" class="err"></div>
        </form>
    </div>

            n: 150000
        };
        const STORAGE_KEY = "ielts_vault_pwd_v1";

        function b64ToBytes(b64) {
            const bin = atob(b64);
            const arr = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
            return arr;
        }

        async function decryptAndBoot(password, saveIt) {
            const btn = document.getElementById("unlockBtn");
            const err = document.getElementById("errBox");
            btn.disabled = true;
            btn.textContent = "Đang giải mã...";
            err.textContent = "";

            try {
                if (!window.crypto || !crypto.subtle) {
                    throw new Error("HTTPS_REQUIRED");
                }
                const enc = new TextEncoder();
                const keyMaterial = await crypto.subtle.importKey(
                    "raw",
                    enc.encode(password),
                    "PBKDF2",
                    false,
                    ["deriveKey"]
                );
                const aesKey = await crypto.subtle.deriveKey(
                    {
                        name: "PBKDF2",
                        salt: b64ToBytes(PAYLOAD.s),
                        iterations: PAYLOAD.n,
                        hash: "SHA-256"
                    },
                    keyMaterial,
                    { name: "AES-GCM", length: 256 },
                    false,
                    ["decrypt"]
                );
                const decryptedBuf = await crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: b64ToBytes(PAYLOAD.i) },
                    aesKey,
                    b64ToBytes(PAYLOAD.c)
                );
                const htmlCode = new TextDecoder().decode(decryptedBuf);
                if (saveIt) {
                    localStorage.setItem(STORAGE_KEY, password);
                } else {
                    localStorage.removeItem(STORAGE_KEY);
                }
                document.open();
                document.write(htmlCode);
                document.close();
            } catch (e) {
                localStorage.removeItem(STORAGE_KEY);
                err.textContent = e && e.message === "HTTPS_REQUIRED"
                    ? "Trình duyệt cần chạy qua HTTPS (GitHub Pages) để giải mã!"
                    : "Sai mật khẩu hoặc dữ liệu không khớp!";
                btn.disabled = false;
                btn.textContent = "Giải Mã & Mở Ứng Dụng";
            }
        }

        document.getElementById("unlockForm").addEventListener("submit", function(ev) {
            ev.preventDefault();
            const pwd = document.getElementById("pwdInput").value;
            const saveIt = document.getElementById("rememberChk").checked;
            decryptAndBoot(pwd, saveIt);
        });

        window.addEventListener("DOMContentLoaded", function() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                document.getElementById("pwdInput").value = saved;
                decryptAndBoot(saved, true);
            }
        });
    </script>
